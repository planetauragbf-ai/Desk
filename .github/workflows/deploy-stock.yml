name: Déploiement Planet'Stock (site autonome)

# Site indépendant de Planet'Desk : https://planet-stock.pages.dev
# Base de données : projet Supabase « Stockage » (les clés ci-dessous).
on:
  push:
    branches: [main, claude/planet-aura-app-0mb0ux]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build du site autonome
        run: npm run build:stock
        env:
          # Projet Supabase « Stockage » — URL du projet et clé PUBLIABLE
          # (sb_publishable_… / anon). Ces deux valeurs sont PUBLIQUES par
          # conception : la clé publiable est incluse dans le code JavaScript
          # envoyé à chaque visiteur, la protection venant des politiques RLS
          # côté base, pas du secret de la clé. La clé SECRÈTE (service_role /
          # sb_secret_…) n'a en revanche JAMAIS sa place ici.
          STOCK_SUPABASE_URL: "https://gfablgawzfbbrrcdpelx.supabase.co"
          STOCK_SUPABASE_ANON_KEY: "sb_publishable_p0IG4hDn1Iyvd0XxzDeq0g_vxErLEfY"

      - name: Page d'accueil du site autonome
        run: mv dist-stock/stock.html dist-stock/index.html

      - name: Créer le projet Pages s'il n'existe pas
        run: npx wrangler pages project create planet-stock --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-stock --project-name=planet-stock --branch=main --commit-dirty=true
